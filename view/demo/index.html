<!-- Página AUTÓNOMA: no carga `dist/cdn/styles/app.css`, así que define aquí su propia fuente
     (y la red de seguridad, para que nunca pueda quedar una serif). -->
<style>
  :root { --iswc-font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  html, body { margin: 0; height: 100%; background: var(--iswc-bg); color: var(--iswc-text); font-family: var(--iswc-font-sans, "Inter", ui-sans-serif, system-ui, sans-serif); }
  .galeria { display: grid; grid-template-columns: 14rem 1fr; height: 100%; }
  .galeria nav { display: grid; align-content: start; gap: 0.25rem; padding: 0.75rem; border-right: 1px solid var(--iswc-border-soft); overflow: auto; }
  .galeria nav iswc-button[aria-current="true"] { --iswc-button-bg: var(--iswc-brand-soft); }
  /* La hoja del kit no bloquea el arranque: sin reservar el alto, los botones crecen de 20 a 44 px al
     llegar ella y empujan a los de abajo (un layout shift de 0,07 en la galería). El alto que usa el
     kit se reserva aquí, que sí está desde el primer pintado. */
  .galeria nav iswc-button { min-height: 2.75rem; }
  /* Aviso del panel cuando el preview del kit no llega (la lista sigue viva). */
  .galeria .aviso { margin: 2rem; color: var(--iswc-text-soft); }
</style>
