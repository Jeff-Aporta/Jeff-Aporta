<!doctype html>
<html lang="es" data-theme="light" data-palette="jeff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeffrey Agudelo · portafolio (vista aislada)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<script src="../../dist/cdn/boot.js?v=i5w9k0"></script>
<link rel="stylesheet" href="../../dist/cdn/styles/app.css?v=rukr0f">
<!-- Vista aislada (QA): mismo kit y mismo pin que la app. -->
<script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@a1df39adb9e421de874dd624901b72daa9e25e5c/dist/cdn/core/loader.min.js"></script>
<script type="module" src="../../dist/cdn/jaLoader.min.js?v=0375iq"></script>
<script type="module">
  // Mismo arranque que la app: marca `data-app-ready` al terminar (watchdog de 6 s).
  const L = globalThis.iswcLoader;
  const listo = () => document.documentElement.setAttribute('data-app-ready', '');
  const watchdog = setTimeout(listo, 6000);
  try {
    await L.loadPageStyles(['iswc-palettes-default']);
    const { KIT_TAGS, APP_TAGS, tagsVista } = await import('../../dist/cdn/js/kit-tags.js?v=nidgz9');
    await L.load(...KIT_TAGS, ...APP_TAGS.filter((t) => t !== 'ja-app'), ...tagsVista('portafolio'));
  } finally {
    clearTimeout(watchdog);
    listo();
  }
</script>
</head>
<body>
  <ja-portafolio></ja-portafolio>
</body>
</html>
