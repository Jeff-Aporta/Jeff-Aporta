<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
  <title>DER — de schemas JSON a controllers REST</title>
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf0ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="960" height="600" fill="url(#f)"/>
  <circle cx="860" cy="80" r="70" fill="#ffc845" opacity=".6"/>
  <path d="m60 520 30 50H30Z" fill="#ff6b6b"/>
  <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif">
    <text x="80" y="150" font-size="104" font-weight="800" fill="#0f172a" letter-spacing="-3">DER</text>
    <text x="84" y="200" font-size="28" fill="#475569">Schemas JSON → POJOs con Zod → REST cliente/servidor</text>
  </g>
  <g font-family="Inter,Arial" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="80" y="290" width="200" height="130" rx="18" fill="#fff" stroke="#d6dce8" stroke-width="2"/>
    <text x="180" y="345" fill="#1e2a5a">schemas</text><text x="180" y="378" fill="#64748b" font-size="18" font-weight="500">.json</text>
    <rect x="380" y="290" width="200" height="130" rx="18" fill="#2563eb"/>
    <text x="480" y="345" fill="#fff">POJOs</text><text x="480" y="378" fill="#dbe6ff" font-size="18" font-weight="500">Zod tipado</text>
    <rect x="680" y="290" width="200" height="130" rx="18" fill="#fff" stroke="#d6dce8" stroke-width="2"/>
    <text x="780" y="345" fill="#1e2a5a">REST</text><text x="780" y="378" fill="#64748b" font-size="18" font-weight="500">client · server</text>
  </g>
  <path d="M286 355h86M586 355h86" stroke="#2563eb" stroke-width="5" marker-end="url(#p)"/>
