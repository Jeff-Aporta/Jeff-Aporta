<!-- 3) Arranque: estilos del kit, tags del kit y transversales; la vista inicial la pide <ja-app> (carga perezosa)
     y aquí solo se espera antes de marcar la página lista (watchdog de 6 s). Los ?v= los pone el build. -->
<script type="module">
  const L = globalThis.iswcLoader;
  const listo = () => document.documentElement.setAttribute('data-app-ready', '');
  const watchdog = setTimeout(() => { console.warn('[ja] el arranque excedió 6 s; se revela la página'); listo(); }, 6000);
  try {
    if (!L) throw new Error('falta iswcLoader');
    await L.loadPageStyles(['iswc-palettes-default']);
    const { KIT_TAGS, tagsArranque } = await import('./dist/cdn/js/kit-tags.js?v=v9gkz3');
    await L.load(...KIT_TAGS, ...tagsArranque());
    await customElements.whenDefined('ja-app');
    await document.querySelector('ja-app')?.vistaLista;
  } catch (e) {
    console.warn('[ja] arranque', e);
  } finally {
    clearTimeout(watchdog);
    listo();
  }
</script>
